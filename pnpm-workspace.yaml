packages:
  - "plugin/app"
  - "worker"
# Alchemy beta.77 uses the Config API from rc.112; rc.113 renamed its constructors.
# Keep its transitive Effect packages on the same API as the Worker.
overrides:
  '@effect/platform-node-shared': 4.0.0-rc.112
  'alchemy>@effect/sql-d1': 4.0.0-rc.112
  'alchemy>@effect/sql-sqlite-do': 4.0.0-rc.112
  'alchemy>@effect/vitest': 4.0.0-rc.112
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  unrs-resolver: false
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260916.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260916.1'
  - '@cloudflare/workerd-linux-64@1.20260916.1'
  - '@cloudflare/workerd-linux-arm64@1.20260916.1'
  - '@cloudflare/workerd-windows-64@1.20260916.1'
  - miniflare@5.20260916.0-alpha
  - workerd@1.20260916.1
  - wrangler@4.133.0
  - '@cloudflare/workers-types@5.20260916.1'
