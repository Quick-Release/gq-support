name: Upload a scanned artifact
description: >-
  Secret-scans the files with scripts/ci/scan-artifact.sh (including inside archives) and uploads
  them only when nothing leaked. Every workflow uploads through this action; scripts/ci/workflow-policy.mjs
  enforces that. Needs the repository checked out.

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files or directories to upload, one per line; no globs or exclusions
    required: true
  retention-days:
    description: Days to keep the artifact; required so no artifact outlives its purpose
    required: true
  if-no-files-found:
    description: warn, error or ignore, as for actions/upload-artifact
    default: warn

runs:
  using: composite
  steps:
    - name: Secret scan before upload
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PATH: ${{ inputs.path }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
      run: |
        [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::retention-days must be a positive number of days"; exit 1; }
        scripts/ci/scan-artifact.sh "$ARTIFACT_PATH"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
