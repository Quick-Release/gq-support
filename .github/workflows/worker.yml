name: Worker

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: worker

jobs:
  # Every PR runs this workflow so `Worker result` can be a required check;
  # the jobs below skip themselves when the PR touches none of these paths.
  changes:
    name: Detect Worker changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - "worker/**"
              - ".github/workflows/worker.yml"
              - "pnpm-lock.yaml"

  test:
    name: Typecheck + tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment CLI startup
        run: pnpm exec alchemy deploy --help
      - run: pnpm typecheck
      - run: pnpm test

  # The one required check: passes when every job passed or was skipped as irrelevant.
  result:
    name: Worker result
    if: always()
    defaults:
      run:
        working-directory: .
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
