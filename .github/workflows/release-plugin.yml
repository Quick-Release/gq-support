name: Release plugin package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version without the v prefix (for example, 0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish Composer package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#plugin-v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build:app

      - name: Verify release metadata and assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          php_version=$(sed -n 's/^ \* Version: *//p' plugin/gq-support.php)
          constant_version=$(sed -n "s/^define( 'GQ_SUPPORT_VERSION', '\([^']*\)' );/\1/p" plugin/gq-support.php)
          stable_tag=$(sed -n 's/^Stable tag: *//p' plugin/readme.txt)

          [ "$php_version" = "$VERSION" ] || { echo "Plugin header is $php_version, expected $VERSION" >&2; exit 1; }
          [ "$constant_version" = "$VERSION" ] || { echo "PHP constant is $constant_version, expected $VERSION" >&2; exit 1; }
          [ "$stable_tag" = "$VERSION" ] || { echo "Stable tag is $stable_tag, expected $VERSION" >&2; exit 1; }
          test -s plugin/assets/dist/app.js

      - name: Assemble package tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf package-dist
          mkdir -p package-dist/assets
          cp plugin/gq-support.php package-dist/
          cp plugin/uninstall.php package-dist/
          cp plugin/readme.txt package-dist/
          cp plugin/README.md package-dist/
          cp plugin/composer.json package-dist/
          cp -R plugin/includes package-dist/includes
          cp -R plugin/assets/dist package-dist/assets/dist

      - name: Publish package branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          package_repo=$(mktemp -d)
          git -C "$package_repo" init --initial-branch=composer
          git -C "$package_repo" config user.name "github-actions[bot]"
          git -C "$package_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R package-dist/. "$package_repo/"
          git -C "$package_repo" add --all
          git -C "$package_repo" commit -m "Release GQ Support $VERSION"
          git -C "$package_repo" tag -a "v$VERSION" -m "GQ Support $VERSION"
          git -C "$package_repo" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git"
          git -C "$package_repo" push --force origin HEAD:refs/heads/composer
          git -C "$package_repo" push origin "v$VERSION"
