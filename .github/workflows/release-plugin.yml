name: Release plugin package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version without the v prefix (for example, 0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "plugin-v*"

# Candidate verification holds no publication or deployment credential: every job before publish
# has a read-only token and no secrets. publish promotes the exact ZIP those jobs tested, after
# checking its recorded SHA-256; nothing is rebuilt between verification and publication.
permissions:
  contents: read

jobs:
  candidate:
    # Built once from the frozen lockfiles and assembled once; every later job uses this artifact.
    name: Build the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      cells: ${{ steps.cells.outputs.cells }}
      # Pinned outside the artifact, so publish can refuse a candidate swapped after testing.
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#plugin-v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Build and assemble the package
        run: |
          pnpm install --frozen-lockfile
          pnpm build:app
          scripts/assemble-plugin-package.sh package-dist

      - name: Size gate on the package
        run: node plugin/tests/performance/size-gate.mjs package-dist

      # One gq-support/ root, exactly the expected runtime files, every version equal to the
      # release, Composer metadata, translations, no secrets; then its SHA-256 and file manifest.
      - name: Package and verify the installable ZIP
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/ci/release-package.mjs pack package-dist package-zip --version "$VERSION"
          echo "sha256=$(jq -r .zip.sha256 package-zip/gq-support.manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Record provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg pnpm_lock "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" \
            --arg composer_lock "$(sha256sum plugin/composer.lock | cut -d' ' -f1)" \
            --arg node "$(node --version)" --arg pnpm "$(pnpm --version)" \
            --arg zip "$(jq -r .zip.sha256 package-zip/gq-support.manifest.json)" \
            '{ version: $version, commit: $commit, run: $run, zip_sha256: $zip, lockfiles: { "pnpm-lock.yaml": $pnpm_lock, "plugin/composer.lock": $composer_lock }, toolchain: { node: $node, pnpm: $pnpm } }' \
            > package-zip/provenance.json
          cat package-zip/provenance.json

      # The floor and current endpoints, each as acceptance (with multisite, and Plugin Check on
      # stable) and as the counter gate.
      - name: Installed-package cells
        id: cells
        run: |
          cells=$(node scripts/ci/runtime-matrix.mjs cells pr | jq -c 'map(select(.id | IN("minimum", "stable", "minimum-counters", "stable-counters")))')
          [ "$(jq length <<<"$cells")" = 4 ]
          echo "cells=$cells" >> "$GITHUB_OUTPUT"

      # The scan before upload is the secret scan of the exact archive that publish ships.
      - name: Keep the release candidate
        uses: ./.github/actions/upload-scanned-artifact
        with:
          name: release-candidate
          path: package-zip/
          if-no-files-found: error
          retention-days: 30

  installed:
    # WP-CLI installs the candidate ZIP on a fresh site: dependency absent and present, lifecycle,
    # browser suite or counters, multisite, Plugin Check, real uninstall and the upgrade from the
    # previous release (plugin/tests/integration/package.sh).
    name: Installed package ${{ matrix.cell.name }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.candidate.outputs.cells) }}
    uses: ./.github/workflows/wordpress-lane.yml
    with:
      cell: ${{ toJSON(matrix.cell) }}
      package: release-candidate

  # Every pull-request and scheduled runtime cell must pass on the release commit; canaries never block.
  compatibility:
    name: Pre-release compatibility
    permissions:
      contents: read
    uses: ./.github/workflows/compatibility.yml
    with:
      tiers: pr scheduled

  publish:
    name: Publish Composer package
    needs: [candidate, installed, compatibility]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      tag: v${{ needs.candidate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: package-zip

      # Refuses an archive whose bytes differ from the recorded SHA-256, then unpacks exactly the
      # manifest's files: the tree published below is the tree every installed cell ran.
      - name: Promote the tested bytes
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ "$(jq -r .version package-zip/gq-support.manifest.json)" = "$VERSION" ]
          [ "$(sha256sum package-zip/gq-support.zip | cut -d' ' -f1)" = "$SHA256" ]
          node scripts/ci/release-package.mjs extract package-zip package-dist

      - name: Publish package branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          sha=$(jq -r .zip.sha256 package-zip/gq-support.manifest.json)
          package_repo=$(mktemp -d)
          git -C "$package_repo" init --initial-branch=composer
          git -C "$package_repo" config user.name "github-actions[bot]"
          git -C "$package_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R package-dist/. "$package_repo/"
          git -C "$package_repo" add --all
          git -C "$package_repo" commit -m "Release GETQUICK Support $VERSION" -m "Tested gq-support.zip SHA-256: $sha (run $GITHUB_RUN_ID, source $GITHUB_SHA)"
          git -C "$package_repo" tag -a "v$VERSION" -m "GETQUICK Support $VERSION" -m "Tested gq-support.zip SHA-256: $sha"
          git -C "$package_repo" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git"
          git -C "$package_repo" push --force origin HEAD:refs/heads/composer
          git -C "$package_repo" push origin "v$VERSION"

  dispatch-registry:
    name: Rebuild Composer registry after release
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions: {}
    # Tags pushed by publish's GITHUB_TOKEN do not trigger push workflows.
    uses: ./.github/workflows/dispatch-registry.yml
    with:
      ref: ${{ needs.publish.outputs.tag }}
    secrets:
      REGISTRY_DISPATCH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
