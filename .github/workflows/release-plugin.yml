name: Release plugin package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version without the v prefix (for example, 0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  performance-gates:
    # The performance gates run against the assembled package, which publish then ships unchanged.
    name: Performance gates on the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.4
          autostart: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Build and assemble the package
        run: |
          pnpm install --frozen-lockfile
          pnpm build:app
          scripts/assemble-plugin-package.sh package-dist

      - name: Size gate on the package
        run: node plugin/tests/performance/size-gate.mjs package-dist

      - name: Install the package on a disposable site
        env:
          GQ_SUPPORT_PLUGIN_DIR: package-dist
        run: bash plugin/tests/integration/run.sh

      - name: Counter gate on the package
        run: |
          pnpm exec playwright install --with-deps chromium
          ddev wp --path=.test-site plugin install woocommerce
          pnpm exec playwright test --config plugin/tests/browser/playwright.config.ts performance.spec.ts

      - name: Keep the tested package
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: package-dist/
          if-no-files-found: error

  publish:
    name: Publish Composer package
    needs: performance-gates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#plugin-v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the tested package
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: package-dist

      - name: Verify release metadata and assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          php_version=$(sed -n 's/^ \* Version: *//p' plugin/gq-support.php)
          constant_version=$(sed -n "s/^define( 'GQ_SUPPORT_VERSION', '\([^']*\)' );/\1/p" plugin/gq-support.php)
          stable_tag=$(sed -n 's/^Stable tag: *//p' plugin/readme.txt)

          [ "$php_version" = "$VERSION" ] || { echo "Plugin header is $php_version, expected $VERSION" >&2; exit 1; }
          [ "$constant_version" = "$VERSION" ] || { echo "PHP constant is $constant_version, expected $VERSION" >&2; exit 1; }
          [ "$stable_tag" = "$VERSION" ] || { echo "Stable tag is $stable_tag, expected $VERSION" >&2; exit 1; }
          test -s package-dist/assets/dist/index.js
          test -s package-dist/assets/dist/index.css
          test -s package-dist/assets/dist/index-rtl.css
          test -s package-dist/assets/launcher.js
          test -s package-dist/assets/launcher.css
          test -s package-dist/assets/dist/index.asset.php
          grep -q "'wp-element'" package-dist/assets/dist/index.asset.php
          ! grep -q "'react-jsx-runtime'" package-dist/assets/dist/index.asset.php

      - name: Publish package branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          package_repo=$(mktemp -d)
          git -C "$package_repo" init --initial-branch=composer
          git -C "$package_repo" config user.name "github-actions[bot]"
          git -C "$package_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R package-dist/. "$package_repo/"
          git -C "$package_repo" add --all
          git -C "$package_repo" commit -m "Release GETQUICK Support $VERSION"
          git -C "$package_repo" tag -a "v$VERSION" -m "GETQUICK Support $VERSION"
          git -C "$package_repo" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git"
          git -C "$package_repo" push --force origin HEAD:refs/heads/composer
          git -C "$package_repo" push origin "v$VERSION"
