name: Rebuild Composer registry

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: "Published Composer package tag"
        required: true
        type: string
    secrets:
      REGISTRY_DISPATCH_TOKEN:
        required: true

permissions: {}

jobs:
  dispatch:
    name: Notify private Composer registry
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plugin_updated
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?REGISTRY_DISPATCH_TOKEN is required}"
          [[ "$RELEASE_TAG" == v* ]] || { echo "Expected a v* package tag" >&2; exit 1; }

          gh api --method POST repos/Quick-Release/getquick-registry/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f event_type=plugin_updated \
            -f 'client_payload[package]=getquick/gq-support' \
            -f "client_payload[ref]=$RELEASE_TAG"
