name: PHP

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "contract/**"
      - ".ddev/**"
      - ".github/workflows/php.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugin

jobs:
  # Every PR runs this workflow so `PHP result` can be a required check;
  # the jobs below skip themselves when the PR touches none of these paths.
  changes:
    name: Detect PHP changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - "plugin/**"
              - "contract/**"
              - ".ddev/**"
              - ".github/workflows/php.yml"
              - "package.json"
              - "pnpm-lock.yaml"

  lint:
    name: PHPCS + PHPStan
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2, cs2pr

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin

      - name: PHPCS
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate PHPCS results
        if: ${{ always() }}
        run: cs2pr ./phpcs-report.xml

      - name: PHPStan
        if: ${{ always() }}
        run: composer analyse -- --error-format=github

  lifecycle-integration:
    name: WordPress ${{ matrix.wordpress.wp-version || 'latest' }} ${{ matrix.suite }} (DDEV)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failure in one WordPress version must not cancel, and hide, the other's result.
      fail-fast: false
      matrix:
        wordpress:
          - wp-version: '6.5.0' # Oldest supported.
            woocommerce-version: '9.4.3' # Newest WooCommerce that supports WordPress 6.5.
          - wp-version: '' # Current latest.
            woocommerce-version: ''
        # The browser counter gate (performance.spec.ts) and the other specs run in parallel,
        # each on its own site; the multisite and Plugin Check steps run with acceptance.
        suite: [acceptance, performance]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.4
          autostart: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Build the Reporter app
        run: |
          pnpm install --frozen-lockfile
          pnpm build:app
          pnpm exec playwright install --with-deps chromium
      - name: Single-site lifecycle and HTTP
        env:
          WP_VERSION: ${{ matrix.wordpress.wp-version }}
        run: bash plugin/tests/integration/run.sh
      # Runs on the single site that run.sh leaves behind, before multisite conversion.
      - name: Browser ${{ matrix.suite }}
        env:
          WOOCOMMERCE_VERSION: ${{ matrix.wordpress.woocommerce-version }}
          GQ_SUPPORT_BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          ddev wp --path=.test-site plugin install woocommerce ${WOOCOMMERCE_VERSION:+--version=$WOOCOMMERCE_VERSION} --activate
          pnpm test:browser
          # Leave the multisite lifecycle checks the same site they had before.
          ddev wp --path=.test-site plugin deactivate woocommerce
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.wordpress.wp-version || 'latest' }}-${{ matrix.suite }}
          path: test-results/
      - name: Multisite lifecycle and cleanup
        if: matrix.suite == 'acceptance'
        run: bash plugin/tests/integration/multisite.sh
      # The Plugin Check action tries to download Requires Plugins from WP.org.
      # GETQUICK Design is private; this DDEV site already has the test fixture.
      - name: Plugin Check
        if: matrix.wordpress.wp-version == '' && matrix.suite == 'acceptance'
        run: |
          ddev wp --path=.test-site plugin install plugin-check --activate
          ddev wp --path=.test-site plugin check gq-support \
            --exclude-directories=tests,app,vendor \
            --exclude-files=composer.json,composer.lock,phpstan.neon.dist,.phpcs.xml.dist

  # The one required check: passes when every job passed or was skipped as irrelevant.
  result:
    name: PHP result
    if: always()
    defaults:
      run:
        working-directory: .
    needs: [changes, lint, lifecycle-integration]
    runs-on: ubuntu-latest
    steps:
      - run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
