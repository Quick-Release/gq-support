name: PHP

on:
  pull_request:
    paths:
      - "plugin/**"
      - ".ddev/**"
      - ".github/workflows/php.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".ddev/**"
      - ".github/workflows/php.yml"

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugin

jobs:
  lint:
    name: PHPCS + PHPStan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2, cs2pr

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin

      - name: PHPCS
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate PHPCS results
        if: ${{ always() }}
        run: cs2pr ./phpcs-report.xml

      - name: PHPStan
        if: ${{ always() }}
        run: composer analyse -- --error-format=github

  lifecycle-integration:
    name: WordPress lifecycle (DDEV)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wp-version: ['6.5.0', ''] # Oldest supported and current latest.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.4
          autostart: false
      - name: Single-site lifecycle and HTTP
        env:
          WP_VERSION: ${{ matrix.wp-version }}
        run: bash plugin/tests/integration/run.sh
      - name: Multisite lifecycle and cleanup
        run: bash plugin/tests/integration/multisite.sh

  plugin-check:
    name: Plugin Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: plugin
          exclude-directories: app,vendor,tests
          exclude-files: composer.json,composer.lock,phpstan.neon.dist,.phpcs.xml.dist
