name: Performance

on:
  # Every PR, so the gate can be a required check.
  pull_request:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/performance.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    # Budgets B5 and B7 in docs/research/idle-performance-budgets.md. The counter gate
    # (B1, B4, B11, B12) is plugin/tests/browser/performance.spec.ts, which `pnpm test:browser`
    # runs in php.yml's DDEV job on every WordPress and WooCommerce variant.
    name: Asset size gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Build the Reporter app
        run: |
          pnpm install --frozen-lockfile
          pnpm build:app

      - name: Size gate and its negative controls
        run: pnpm test:size
