name: Deploy Support Worker
run-name: Deploy Support Worker (${{ inputs.stage }}) ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage and GitHub Environment
        required: true
        type: choice
        options: [staging, prod]
      request_id:
        description: Optional non-secret correlation ID
        required: false

permissions:
  contents: read

# Serialize deploys and rotations. A cancelled apply could leave the Worker
# without its key between script upload and secret reconciliation.
concurrency:
  group: deploy-worker-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify the stage App and deploy with Alchemy
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          CLOUDFLARE_ACCOUNT_ID: 8f38791a8c37b182239af2a385ab3c31
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_APP_CLIENT_ID: ${{ vars.SUPPORT_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_ID: ${{ vars.SUPPORT_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ vars.SUPPORT_GITHUB_APP_SLUG }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.SUPPORT_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.SUPPORT_GITHUB_WEBHOOK_SECRET }}
          GITHUB_WEBHOOK_PREVIOUS_SECRET: ${{ secrets.SUPPORT_GITHUB_WEBHOOK_PREVIOUS_SECRET }}
          GITHUB_WEBHOOK_DIAGNOSTICS: ${{ inputs.stage == 'staging' && vars.SUPPORT_GITHUB_WEBHOOK_DIAGNOSTICS == 'true' && 'true' || 'false' }}
          # Public dashboard keys and opaque staff IDs; unset leaves the operations API closed.
          OPERATIONS_API_KEYS: ${{ vars.SUPPORT_OPERATIONS_API_KEYS }}
          OPERATIONS_STAFF: ${{ vars.SUPPORT_OPERATIONS_STAFF }}
          # The independent checker's public key; unset closes its probe and report routes.
          OPERATIONS_CHECKER_KEYS: ${{ vars.SUPPORT_OPERATIONS_CHECKER_KEYS }}
          # Discord webhook URLs are credentials, per stage environment. Unset closes that channel.
          DISCORD_SUPPORT_REQUESTS_WEBHOOK_URL: ${{ secrets.SUPPORT_DISCORD_SUPPORT_REQUESTS_WEBHOOK_URL }}
          DISCORD_OPERATIONAL_INCIDENTS_WEBHOOK_URL: ${{ secrets.SUPPORT_DISCORD_OPERATIONAL_INCIDENTS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          node scripts/verify-github-app.ts "$DEPLOY_STAGE"
          pnpm exec alchemy deploy --stage "$DEPLOY_STAGE" --yes
          node scripts/audit-github-app-custody.ts "$DEPLOY_STAGE"
