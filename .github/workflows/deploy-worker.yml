name: Deploy Support Worker
run-name: Deploy Support Worker (${{ inputs.stage }}) ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage and GitHub Environment
        required: true
        type: choice
        options: [staging, prod]
      request_id:
        description: Optional non-secret correlation ID
        required: false

permissions:
  contents: read

# Serialize deploys and rotations. A cancelled apply could leave the Worker
# without its key between script upload and secret reconciliation.
concurrency:
  group: deploy-worker-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # This one process retains the exact native candidate through post-plan
      # GitHub approval. Missing reviewed config/delivery/runner/window refuses.
      # There is deliberately no subsequent CLI deploy (which would replan).
      - name: Require safe pre-apply plan and authenticated continuation
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          CLOUDFLARE_ACCOUNT_ID: 8f38791a8c37b182239af2a385ab3c31
        run: node --import ./deploy/planning-loader.mjs deploy/planning-entry.ts
